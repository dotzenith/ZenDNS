[package]
name = "zendns"
version = "1.1.2"
edition = "2024"
description = "Manage Dynamic DNS with serenity"
homepage = "https://github.com/dotzenith/ZenDNS"
repository = "https://github.com/dotzenith/ZenDNS"
license = "MIT"

[dependencies]
anyhow = "1.0.86"
regex = "1.10.6"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
simplelog = "0.12.2"
log = "0.4.22"
clap = { version = "4.5.16", features = ["cargo", "derive"] }
directories = "6.0.0"
wincode = "0.6.3"
nutype = { version = "0.8.0", features = ["serde"] }

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
